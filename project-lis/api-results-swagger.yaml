openapi: 3.0.3
info:
  title: LIS Results Webhook API
  version: 1.0.0
  description: Интеграционный шлюз для асинхронной передачи валидированных лабораторных результатов из ЛИС во внешнюю Медицинскую Информационную Систему (МИС) врача.

servers:
  - url: https://api.clinic-network.com/v1
    description: Production Server
  - url: https://stage-api.clinic-network.com/v1
    description: Staging Server

paths:
  /webhook/lab-results:
    post:
      summary: Отправка результатов исследования
      description: Принимает массив результатов по конкретному штрихкоду пробирки (маршруту) и привязывает их к ИЛН заказа.
      operationId: sendLabResults
      security:
        - bearerAuth: []
      requestBody:
        description: JSON-объект с результатами тестов и идентификаторами заказа.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabResultPayload'
      responses:
        '200':
          description: Успешно получено и обработано МИС.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Ошибка валидации (Bad Request) - отсутствуют обязательные поля.
        '401':
          description: Ошибка авторизации (неверный или просроченный Bearer Token).
        '404':
          description: Ошибка бизнес-логики - заказ с переданным ИЛН не найден в МИС.
        '409':
          description: Конфликт (Idempotency Error) - результаты по данному ИЛН уже загружены ранее.
        '500':
          description: Внутренняя ошибка сервера МИС.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LabResultPayload:
      type: object
      required:
        - message_id
        - iln
        - order_status
        - collection_datetime
        - patient
        - laboratory
        - results
        - validation
      properties:
        message_id:
          type: string
          format: uuid
          description: Уникальный идентификатор сообщения (UUID) для обеспечения идемпотентности.
          example: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
        iln:
          type: string
          description: 12-значный Идентификационный Личный Номер заказа.
          example: "123456789101"
        order_status:
          type: string
          example: "COMPLETED"
        collection_datetime:
          type: string
          format: date-time
          description: Дата и время забора биоматериала (ISO 8601).
          example: "2026-10-19T08:30:00Z"
        patient:
          $ref: '#/components/schemas/PatientInfo'
        laboratory:
          $ref: '#/components/schemas/LaboratoryInfo'
        results:
          type: array
          description: Массив выполненных тестов.
          items:
            $ref: '#/components/schemas/TestResultItem'
        validation:
          $ref: '#/components/schemas/ValidationInfo'

    PatientInfo:
      type: object
      required:
        - full_name
        - dob
        - gender
      properties:
        full_name:
          type: string
          example: "Иванов Иван Иванович"
        dob:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          description: Пол пациента (M/F). Используется для расчета референсов.
          example: "M"
        phone:
          type: string
          example: "+79991234567"

    LaboratoryInfo:
      type: object
      required:
        - legal_name
        - department
      properties:
        legal_name:
          type: string
          example: "ООО 'Медицинский центр'"
        department:
          type: string
          example: "Отдел молекулярной диагностики (ПЦР)"

    TestResultItem:
      type: object
      required:
        - test_code
        - test_name
        - test_status
        - value
      properties:
        test_code:
          type: string
          example: "PCR-COV-19"
        test_name:
          type: string
          example: "РНК SARS-CoV-2 (COVID-19)"
        test_status:
          type: string
          example: "VALIDATED"
        value:
          type: string
          example: "Не обнаружено"
        reference_range:
          type: string
          example: "Не обнаружено"
        unit:
          type: string
          example: ""

    ValidationInfo:
      type: object
      required:
        - doctor_full_name
        - validated_datetime
      properties:
        doctor_full_name:
          type: string
          description: ФИО врача КДЛ, валидировавшего результат.
          example: "Смирнова А.В."
        validated_datetime:
          type: string
          format: date-time
          example: "2026-10-19T14:45:00Z"

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Results successfully accepted by MIS."
